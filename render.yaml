services:
  - type: web
    name: choicer-voicer
    runtime: node
    plan: free
    rootDir: voicer
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: MAX_UPLOAD_MB
        value: "800"
      - key: NODE_VERSION
        value: "22"
